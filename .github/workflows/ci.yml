name: MoonBit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Python for the independent QF_BV oracle
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install pinned Z3 oracle
        run: python -m pip install -r tests/requirements.txt

      - name: Show toolchain versions
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        run: moon check --deny-warn

      - name: Run tests
        run: moon test

      - name: Build
        run: moon build

      - name: Run the worked examples
        run: moon run cmd/main

      - name: Differentially check QF_BV cases with Z3
        run: python tests/qfbv_z3_oracle.py

      - name: Generate API documentation
        run: moon doc

      - name: Validate Mooncakes package contents
        run: moon package --list
