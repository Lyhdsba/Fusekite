name: MoonBit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        run: moon check --deny-warn

      - name: Run tests
        run: moon test

      - name: Build
        run: moon build

      - name: Run the worked examples
        run: moon run cmd/main

      - name: Generate API documentation
        run: moon doc

      - name: Validate Mooncakes package contents
        run: moon package --list
