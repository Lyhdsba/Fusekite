name: MoonBit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          version="$(tr -d '\r\n' < .moonbit-version)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9a-f]+$ ]]; then
            echo "Expected a compiler release with commit hash in .moonbit-version" >&2
            exit 1
          fi
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Python for the independent QF_BV oracle
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install pinned Z3 oracle
        run: python -m pip install -r tests/requirements.txt

      - name: Verify toolchain version
        shell: bash
        run: |
          moon version --all
          version="$(tr -d '\r\n' < .moonbit-version)"
          [[ "$(moonc -v)" == "v$version "* ]]

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        run: moon check --deny-warn

      - name: Run tests
        run: moon test

      - name: Build
        run: moon build

      - name: Run the worked examples
        run: moon run cmd/main

      - name: Check and run the downstream consumer
        run: |
          moon -C examples/status-indicator fmt --check
          moon -C examples/status-indicator check --deny-warn
          moon -C examples/status-indicator run .

      - name: Differentially check QF_BV cases with Z3
        run: python tests/qfbv_z3_oracle.py

      - name: Generate API documentation
        run: moon doc

      - name: Validate Mooncakes package contents
        run: moon package --list
